version: 2
models:
  - name: stg_orders
    description: Validated and deduplicated order rows at one row per order_id.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: order_date
        tests: [not_null]
  - name: monthly_sales
    description: Monthly category sales mart.
    columns:
      - name: sales_month
        tests: [not_null]
      - name: category
        tests: [not_null]
